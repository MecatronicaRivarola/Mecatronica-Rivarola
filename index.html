<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecatrónica Rivarola - Sistema de Gestión</title>
    <!-- Tailwind CSS clásico para evitar bloqueos del navegador -->
   <style>
    body { background-color: #030712; color: #f3f4f6; font-family: sans-serif; margin: 0; }
    nav { background-color: #111827; padding: 16px; border-bottom: 4px solid #ea580c; display: flex; flex-direction: column; justify-content: space-between; align-items: center; gap: 16px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
    @media (min-width: 768px) { nav { flex-direction: row; } }
    h1 { color: #f97316; font-weight: 900; letter-spacing: 0.1em; margin: 0; font-size: 24px; }
    .nav-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn-orange { background-color: #ea580c; color: #000; font-weight: bold; border: none; padding: 8px 16px; rounded-radius: 8px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .btn-orange:hover { background-color: #f97316; }
    .btn-gray { background-color: #1f2937; color: #d1d5db; font-weight: bold; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .btn-gray:hover { background-color: #374151; }
    main { max-w: 1280px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 1024px) { main { grid-template-columns: 1fr 2fr; } }
    section { background-color: #111827; padding: 24px; border-radius: 12px; border: 1px solid #1f2937; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    h2 { font-size: 18px; font-weight: bold; margin-top: 0; margin-bottom: 16px; color: #f97316; border-b: 1px solid #1f2937; padding-bottom: 8px; border-bottom: 1px solid #1f2937; }
    .form-group { margin-bottom: 16px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { display: block; font-size: 12px; font-weight: bold; color: #9ca3af; text-transform: uppercase; margin-bottom: 4px; }
    input, textarea, select { w-width: 100%; width: 100%; background-color: #030712; border: 1px solid #374151; border-radius: 8px; padding: 8px 12px; color: #fff; box-sizing: border-box; }
    input:focus, textarea:focus, select:focus { border-color: #f97316; outline: none; }
    .btn-submit { width: 100%; background-color: #f97316; border: none; color: #000; font-weight: 900; padding: 12px; border-radius: 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; margin-top: 16px; }
    .btn-submit:hover { background-color: #ea580c; }
    .box-seña { background-color: #030712; padding: 12px; border-radius: 8px; border: 1px solid #1f2937; margin-top: 16px; }
    .text-seña-title { font-size: 12px; font-weight: bold; color: #fb923c; display: block; text-transform: uppercase; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 12px 16px; border-bottom: 1px solid #1f2937; color: #9ca3af; font-size: 12px; text-transform: uppercase; }
    td { padding: 16px; border-bottom: 1px solid #1f2937; font-size: 14px; }
    .patente { font-family: monospace; font-weight: bold; color: #f97316; text-transform: uppercase; }
    .chasis { font-size: 10px; color: #6b7280; font-family: monospace; text-transform: uppercase; }
    .cliente { font-size: 12px; color: #9ca3af; }
    .badge-falla { font-size: 11px; background-color: #450a0a; color: #f87171; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(127,29,29,0.3); display: inline-block; margin-top: 4px; }
    .badge-estado { background-color: rgba(249,115,22,0.1); color: #f97316; font-size: 12px; padding: 4px 10px; border-radius: 9999px; border: 1px solid rgba(249,115,22,0.2); font-weight: bold; display: inline-block; text-transform: uppercase; }
    .monto-emerald { color: #34d399; font-weight: bold; font-size: 12px; }
</style>

</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <!-- Barra de Navegación Premium Negro y Naranja -->
           <div class="nav-buttons">
            <button class="btn-orange">📥 Registrar Ingreso</button>
            <button class="btn-gray">🚗 Turnero / Taller</button>
            <button class="btn-gray">📋 Presupuestos</button>
            <button class="btn-gray">💰 Control de Caja</button>
        </div>

            <div class="flex flex-wrap gap-2">
                <button class="bg-orange-600 text-black font-bold px-4 py-2 rounded-lg text-sm shadow-md hover:bg-orange-500 transition-all">📥 Registrar Ingreso</button>
                <button class="bg-gray-800 text-gray-300 font-bold px-4 py-2 rounded-lg text-sm hover:bg-gray-700 transition-all">🚗 Turnero / Taller</button>
                <button class="bg-gray-800 text-gray-300 font-bold px-4 py-2 rounded-lg text-sm hover:bg-gray-700 transition-all">📋 Presupuestos</button>
                <button class="bg-gray-800 text-gray-300 font-bold px-4 py-2 rounded-lg text-sm hover:bg-gray-700 transition-all">💰 Control de Caja</button>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- COLUMNA 1: Formulario de Ingreso Súper Completo -->
        <section class="bg-gray-900 p-6 rounded-xl border border-gray-800 shadow-2xl lg:col-span-1">
            <h2 class="text-xl font-bold mb-4 text-orange-500 flex items-center gap-2 border-b border-gray-800 pb-2">
                📥 Ingreso de Vehículo
            </h2>
            <form class="space-y-4">
                <!-- Datos del Auto -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Patente</label>
                        <input type="text" placeholder="ABC 123" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500 uppercase">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">N° Chasis</label>
                        <input type="text" placeholder="17 dígitos" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500 uppercase">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Marca y Modelo</label>
                    <input type="text" placeholder="Ej: VW Gol Trend 2017" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500">
                </div>

                <!-- Datos del Cliente -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Nombre Cliente</label>
                        <input type="text" placeholder="Juan Pérez" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Teléfono</label>
                        <input type="tel" placeholder="11 2345-6789" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <!-- Detalles e Ingreso de Repuestos -->
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Falla / Diagnóstico Inicial</label>
                    <textarea rows="2" placeholder="Detalle del problema por el que ingresa..." class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500 resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">¿Trae Repuestos el Cliente?</label>
                    <select class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500">
                        <option value="no">No, compra el taller</option>
                        <option value="si">Sí, ya los trajo en el baúl</option>
                        <option value="parcial">Trajo solo algunos</option>
                <button type="button" class="btn-submit">🚀 Guardar e Ingresar al Taller</button>

                </div>

                <!-- 💡 NUEVO: Control de Seña y Pagos (Tu buena idea) -->
                <div class="p-3 bg-gray-950 rounded-lg border border-gray-800 space-y-3">
                    <span class="text-xs font-bold text-orange-400 block uppercase">💰 Control de Seña Inicial</span>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Monto Seña ($)</label>
                            <input type="number" placeholder="0.00" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2 py-1 text-white focus:outline-none focus:border-orange-500">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Método de Pago</label>
                            <select class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2 py-1 text-white focus:outline-none focus:border-orange-500">
                                <option value="efectivo">Efectivo</option>
                                <option value="transferencia">Transferencia</option>
                                <option value="tarjeta">Débito / Crédito</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Botón Naranja Fuego -->
                <button type="button" class="w-full bg-orange-500 hover:bg-orange-600 text-black font-black py-3 px-4 rounded-lg shadow-lg hover:shadow-orange-500/20 transition-all cursor-pointer text-center uppercase tracking-wider text-sm">
                    🚀 Guardar e Ingresar al Taller
                </button>
            </form>
        </section>

        <!-- COLUMNA 2 y 3: Turnero Visual Dinámico -->
        <section class="bg-gray-900 p-6 rounded-xl border border-gray-800 shadow-2xl lg:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-orange-500 flex items-center gap-2 border-b border-gray-800 pb-2">
                🚗 Turnero / Autos Activos en Reparación
            </h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-gray-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-4">Patente / Chasis</th>
                            <th class="py-3 px-4">Vehículo & Cliente</th>
                            <th class="py-3 px-4">Repuestos / Falla</th>
                            <th class="py-3 px-4 text-right">Seña / Estado</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800 text-sm">
                        <!-- Ejemplo Real con tu nueva estructura -->
                        <tr class="hover:bg-gray-850/50 transition-colors">
                            <td class="py-4 px-4">
                                <div class="font-mono font-bold text-orange-400 uppercase">AF 789 CD</div>
                                <div class="text-[10px] text-gray-500 font-mono uppercase">CH: 93849201A837</div>
                            </td>
                            <td class="py-4 px-4">
                                <div class="font-semibold text-white">Peugeot 208 Sport 2022</div>
                                <div class="text-xs text-gray-400">Martín Rivarola • 11-5555-1234</div>
                            </td>
                            <td class="py-4 px-4">
                                <div class="text-gray-300">Falla eléctrica en tablero.</div>
                                <span class="text-[11px] bg-red-950 text-red-400 px-2 py-0.5 rounded border border-red-900/30">Faltan Repuestos</span>
                            </td>
                            <td class="py-4 px-4 text-right space-y-1">
                                <div class="text-xs text-emerald-400 font-bold">Seña: $50.000</div>
                                <span class="inline-block bg-orange-500/10 text-orange-400 text-xs px-2.5 py-1 rounded-full border border-orange-500/20 font-bold uppercase tracking-wide">En Diagnóstico</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
</body>
</html>
